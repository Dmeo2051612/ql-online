services:
  - type: web
    name: ql-online
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 0
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: FLASK_DEBUG
        value: "0"
      - key: FIREBASE_SERVICE_ACCOUNT
        value: /etc/secrets/firebase-service-account.json
