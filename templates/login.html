<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng nhập</title>

        <link
            rel="stylesheet"
            href="/static/css/login.css"
        >
    </head>

    <body>
        <div class="login-container">
            <div class="login-card">
                <h1>Đăng nhập</h1>
                <p>Hệ thống đăng ký môn học</p>
                

                <form id="login-form">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập email"
                        required
                    >

                    <label for="matkhau">Mật khẩu</label>
                    <input
                        type="password"
                        id="matkhau"
                        name="matkhau"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                    <button type="submit">Đăng nhập</button>
                </form>

                <p id="login-error"></p>
            </div>
        </div>

        <script
            type="module"
            src="/static/js/login-firebase.js"
        ></script>
    </body>
</html>
